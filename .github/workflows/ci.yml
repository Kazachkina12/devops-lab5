name: CI

on:
  push:
    branches: [ main ]

jobs:
  test_app:
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: npm test

  build_app:
    runs-on: ubuntu-latest
    needs: test_app
    container: node:20-alpine
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: devops-lab5-${{ github.sha }}
          path: dist/
          retention-days: 7
